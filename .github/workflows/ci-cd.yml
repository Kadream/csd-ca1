# CI/CD pipeline for the Blood Pressure Category Calculator
# CI (every PR and main): build, unit + BDD tests, code coverage (80% gate), package
# CD (main only): provision Azure with Bicep -> deploy to staging slot -> E2E tests (Playwright) -> load test (k6) -> approval -> swap to production

name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # "Run workflow" button = start the environment and deploy

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-csd-ca1
  AZURE_WEBAPP_NAME: kadream-bpcalc-ca1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test (with code coverage)
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage
    - name: Coverage report (minimum 80% line coverage)
      uses: danielpalme/ReportGenerator-GitHub-Action@v5
      with:
        reports: 'coverage/**/coverage.cobertura.xml'
        targetdir: 'coveragereport'
        reporttypes: 'MarkdownSummaryGithub'
        classfilters: '-BPCalculator.Pages.Pages_*;-BPCalculator.Pages.Shared.*;-BPCalculator.Program;-BPCalculator.Startup'
        customSettings: 'minimumCoverageThresholds:lineCoverage=80'
    - name: Publish coverage summary
      if: always()
      run: cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
    - name: Publish
      run: dotnet publish BPCalculator/BPCalculator.csproj --no-build --configuration Release --output ./publish
    - name: Upload artifact (release candidate)
      uses: actions/upload-artifact@v7
      with:
        name: bpcalculator
        path: ./publish

  provision:
    name: Provision Azure infrastructure (Bicep)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      stagingUrl: ${{ steps.bicep.outputs.stagingUrl }}
      productionUrl: ${{ steps.bicep.outputs.productionUrl }}
    steps:
    - uses: actions/checkout@v7
    - name: Azure login (OIDC, no stored password)
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Deploy Bicep template
      id: bicep
      run: |
        az deployment group create \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --template-file infra/main.bicep \
          --parameters appName=${{ env.AZURE_WEBAPP_NAME }} \
          --query properties.outputs --output json > outputs.json
        echo "stagingUrl=$(jq -r .stagingUrl.value outputs.json)" >> $GITHUB_OUTPUT
        echo "productionUrl=$(jq -r .productionUrl.value outputs.json)" >> $GITHUB_OUTPUT

  deploy-staging:
    name: Deploy to staging slot
    needs: provision
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ needs.provision.outputs.stagingUrl }}
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Download artifact (same build as tested)
      uses: actions/download-artifact@v8
      with:
        name: bpcalculator
        path: ./publish
    - name: Azure login (OIDC, no stored password)
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Deploy to staging slot
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        slot-name: staging
        package: ./publish
    - name: Smoke test (staging)
      run: curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors --output /dev/null ${{ needs.provision.outputs.stagingUrl }}

  e2e-tests:
    name: E2E tests on staging (Playwright)
    needs: [provision, deploy-staging]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
    - uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browser (Chromium)
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests against staging
      run: npx playwright test
      env:
        BASE_URL: ${{ needs.provision.outputs.stagingUrl }}
    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: e2e/playwright-report/
    
  load-test:
    name: Performance test on staging (k6)
    needs: [provision, e2e-tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup k6
      uses: grafana/setup-k6-action@v1
    - name: Run k6 load test against staging
      uses: grafana/run-k6-action@v1
      env:
        BASE_URL: ${{ needs.provision.outputs.stagingUrl }}
      with:
        path: performance/load-test.js

  swap-production:
    name: Swap staging to production (blue/green)
    needs: [provision, deploy-staging, e2e-tests, load-test]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ needs.provision.outputs.productionUrl }}
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Azure login (OIDC, no stored password)
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Swap staging slot into production
      run: az webapp deployment slot swap --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.AZURE_WEBAPP_NAME }} --slot staging --target-slot production
    - name: Smoke test (production)
      run: curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors --output /dev/null ${{ needs.provision.outputs.productionUrl }}